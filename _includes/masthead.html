{% include base_path %}
<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="site-nav" aria-label="Primary navigation">
        <ul class="site-nav__links">
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="site-nav__item">
              <a
                class="site-nav__link{% if page.url == link.url %} is-active{% endif %}"
                href="{{ domain }}{{ link.url }}"
                {% if page.url == link.url %}aria-current="page"{% endif %}
              >{{ link.title }}</a>
            </li>
          {% endfor %}
          <li id="theme-toggle" class="site-nav__theme">
            <button type="button" aria-label="Toggle color theme" title="Toggle color theme">
              <i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true"></i>
            </button>
          </li>
        </ul>
      </nav>
    </div>
  </div>
</div>
