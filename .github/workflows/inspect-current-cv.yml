name: Inspect current CV source

on:
  push:
    branches:
      - feature/academic-profile-system
    paths:
      - ".github/workflows/inspect-current-cv.yml"

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Render scanned CV pages
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          mkdir -p /tmp/cv-pages
          pdftoppm -f 1 -l 4 -jpeg -scale-to 1500 -jpegopt quality=72 files/Massimo_Capuano_CV.pdf /tmp/cv-pages/page
          for page in /tmp/cv-pages/*.jpg; do
            echo "===== IMAGE_START $(basename "$page") ====="
            base64 -w0 "$page"
            echo
            echo "===== IMAGE_END ====="
          done
